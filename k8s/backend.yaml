apiVersion: apps/v1 
kind: Deployment 

metadata: 
  name: backend 

spec:
  replicas: 2 

  selector:
    matchLabels:
      app: backend 
  
  template:
    metadata:
      labels:
        app: backend 

    spec:
      containers:
      - name: backend 
        image: flask-backend:v2

        imagePullPolicy: Never 

        ports:
        - containerPort: 5000 

        env:
        - name: MONGO_HOST 
          valueFrom:
            configMapKeyRef:
              name: backend-config 
              key: MONGO_HOST 

--- 
apiVersion: v1 
kind: Service

metadata:
  name: backend-service 

spec:
  selector: 
    app: backend 

  ports:
  - port: 5000 
    targetPort: 5000